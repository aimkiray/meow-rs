[package]
name = "meow-bench"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "meow-bench"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
hickory-proto = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
# RLIMIT_NOFILE raise in `raise_nofile_limit` — conn-heavy workloads need more
# than the macOS default soft cap of 256.
libc = "0.2"

[lints]
workspace = true
